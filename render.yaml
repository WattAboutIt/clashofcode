services:
  - type: web
    name: clashofcode-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clashofcode-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://clashofcode-frontend.onrender.com
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /docs

  - type: web
    name: clashofcode-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://clashofcode-backend.onrender.com

databases:
  - name: clashofcode-db
    databaseName: clashofcode
    plan: free